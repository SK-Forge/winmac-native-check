name: WinMac確認

on:
  push:
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false   # 片方が落ちても、もう片方の結果まで必ず出す
      matrix:
        os: [windows-latest, macos-latest]   # macos-latest = Apple Silicon
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: 組み立て
        id: build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release 2>&1 | tee build.log
          cmake --build build --config Release 2>&1 | tee -a build.log

      - name: 読み込みテスト
        id: test
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error 2>&1 | tee test.log

      # 成功時も、何を確かめたかを Summary に残す（テスト件数が0なら上の手順で赤になる）
      # 件数は ctest「out of N」→ pytest「N passed」の順に探す。取れなくても記録は失敗させない
      - name: 成功の記録
        if: success()
        run: |
          n=$( { grep -Eo 'out of [0-9]+' test.log || grep -Eo '[0-9]+ passed' test.log; } 2>/dev/null | grep -Eo '[0-9]+' | tail -1 || true)
          {
            echo "### 確認OK: ${{ runner.os }} (${{ runner.arch }})"
            echo "- 組み立て: 成功 / テスト: すべて成功（件数: ${n:-不明}）"
          } >> "$GITHUB_STEP_SUMMARY"

      # 失敗したときだけ、AIに貼れる要約を Job Summary に出す
      - name: 失敗の報告を作る
        if: failure()
        run: |
          failed=""
          [ "${{ steps.build.outcome }}" = "failure" ] && failed="$failed 組み立て"
          [ "${{ steps.test.outcome }}" = "failure" ] && failed="$failed 読み込みテスト"
          cat build.log test.log 2>/dev/null > ci.log || true
          "$(command -v python3 || command -v python)" scripts/failure_report.py ci.log $failed
